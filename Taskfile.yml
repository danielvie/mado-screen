version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Run the Windows overlay prototype
    cmds:
      - cargo run

  run-release:
    desc: Run the optimized Windows overlay
    cmds:
      - cargo run --release

  perf:
    desc: Measure optimized offscreen input and rendering without opening an overlay
    cmds:
      - powershell.exe -NoProfile -Command 'New-Item -ItemType Directory -Force -Path target | Out-Null'
      - rustc --edition 2024 -O -A dead_code scripts/perf.rs -o target/perf.exe
      - powershell.exe -NoProfile -Command '& ./target/perf.exe'

  build:
    desc: Build the Windows overlay prototype
    cmds:
      - cargo build

  install:
    desc: Build a release and install it to ~/.local/bin
    aliases: [i]
    cmds:
      - cargo build --release
      - >-
        powershell.exe -NoProfile -Command
        '$ErrorActionPreference = "Stop"; New-Item -ItemType Directory -Force -Path "$HOME/.local/bin" | Out-Null; Copy-Item -Path "target/release/mado-screen-poc.exe" -Destination "$HOME/.local/bin/mado-screen.exe" -Force'

  test:
    desc: Run PoC unit and native resource checks
    cmds:
      - cargo test

  icon:
    desc: Regenerate the executable icon from the default tray artwork
    cmds:
      - cargo test generate_executable_icon -- --ignored --exact tray::tests::generate_executable_icon

  test-settings:
    desc: Check settings completion, validation, activation key, preservation and temporary-pen duration
    cmds:
      - cargo test --release settings_ -- --test-threads=1

  test-menu:
    desc: Run only new floating-menu feature tests
    cmds:
      - cargo test panel_menu_ -- --test-threads=1

  test-menu-followup:
    desc: Run only reference-layout and compact brush-tip feature tests
    cmds:
      - cargo test --release panel_menu_followup_ -- --test-threads=1

  test-menu-live:
    desc: Check the release menu through owned windows without system input
    cmds:
      - cargo build --release
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/menu-followup-check.ps1

  test-clear-help:
    desc: Run only quick-clear, shortcut-binding and terminal-help checks
    cmds:
      - cargo test --release controls::tests -- --test-threads=1
      - cargo test --release quick_clear_ -- --test-threads=1
      - cargo test --release startup_help_ -- --test-threads=1

  smoke:
    desc: Validate desktop rendering, cleanup, and idle CPU over 30 seconds
    deps: [build]
    cmds:
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke.ps1 -Exe target/debug/mado-screen-poc.exe

  check:
    desc: Check formatting and Rust warnings
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings

  clean:
    desc: Remove Cargo build artifacts
    cmds:
      - cargo clean
